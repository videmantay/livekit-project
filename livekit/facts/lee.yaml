# Seed for Lee's facts (ADR-19, ADR-21). This file is a one-time import: cloud-run
# loads it into Firestore as drafts, Lee edits and publishes them on the admin
# page, and then this file is deleted. The agent never reads it directly.
#
# This repo is public and anything in the prompt can be extracted (ADR-7), so
# everything here is public. Never add contact details, addresses, legal name,
# program names or anything Lee hasn't approved for a stranger to read (ADR-14).
#
# Every entry starts as `reviewed: false` and imports as a draft. Only entries
# Lee publishes in admin reach the agent.
#
# Entry fields:
#   topic     what the visitor might ask about
#   level     how strong Lee is, in plain words ("None" is a valid level)
#   verified  what Lee has actually done, stated as facts
#   limits    what Lee has NOT done, and what the agent must not claim or expand on
#   source    where the fact came from (resume, Lee, etc.)
#   reviewed  true once Lee has approved the entry

version: 1
source_documents:
  - FDE résumé, Nov 2026

profile:
  - topic: Current role and focus
    level: Senior
    verified: >
      Senior Software Engineer at Lockheed Martin since June 2021. Positions
      themself as a forward deployed engineer: full-stack work and AI
      integration, working directly with the people who use the software.
      Open to travel and on-site customer deployment.
    limits: >
      Don't discuss availability, start dates, pay or offers. Send those to Lee
      (ADR-7, ADR-11).
    source: resume
    reviewed: false

  - topic: Years of experience
    level: 7+ years as a software engineer, plus 6 years as a teacher and coordinator
    verified: >
