# Lint and test the cloud-run gatekeeper against the Firestore emulator.
# No secrets: tests/conftest.py sets fake config, and the emulator uses a demo project.
name: cloud-run

on:
  push:
    branches: [dev, main]
    paths:
      - "cloud-run/**"
      - "firebase/firestore.rules" # The rules tests load these through the emulator.
      - "firebase/firebase.json"
      - ".github/workflows/cloud-run.yml"
  pull_request:
    branches: [main]
    paths:
      - "cloud-run/**"
      - "firebase/firestore.rules"
      - "firebase/firebase.json"
      - ".github/workflows/cloud-run.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: cloud-run/uv.lock

      # The Firestore emulator needs Java and the Firebase CLI.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Lint
        working-directory: cloud-run
        run: uv run --frozen ruff check .

      - name: Test against the Firestore emulator
        working-directory: firebase
        run: >-
          npx --yes firebase-tools@15.24.0 emulators:exec
          --only firestore --project demo-portfolio
          "cd ../cloud-run && uv run --frozen pytest"
