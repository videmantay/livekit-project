# Lint and unit-test the agent. No secrets and no calls to LiveKit, Tavus, ElevenLabs or Gemini.
# The grounding tests and their nightly run (ADR-21) need real keys and will get their own workflow.
name: livekit

on:
  push:
    branches: [dev, main]
    paths:
      - "livekit/**"
      - ".github/workflows/livekit.yml"
  pull_request:
    branches: [main]
    paths:
      - "livekit/**"
      - ".github/workflows/livekit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: livekit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: livekit/uv.lock

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Test
        run: uv run --frozen pytest
